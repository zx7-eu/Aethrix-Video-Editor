[package]
name = "aethrix"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
include_dir = "0.7"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.34"
tempfile = "3"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
wry = "0.53"

[profile.release]
strip = true

[build-dependencies]
winresource = "0.1.34"
