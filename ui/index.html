<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aethrix</title><link rel="icon" type="image/png" href="/ui/aethrix.png"><link rel="stylesheet" href="/ui/style.css"></head><body>
<header><div class="brand"><img class="logo" src="/ui/aethrix.png" alt="">Aethrix</div><div class="project"><span class="icon" data-icon="folder"></span><input id="projectName" aria-label="Project name"><span class="saved" id="saved">Saved locally</span></div><div class="headtools"><button id="projectMenu" title="Project options" aria-label="Project options" data-icon="folder-open"></button><button id="undo" title="Undo (Ctrl+Z)" data-icon="undo-2"></button><button id="redo" title="Redo (Ctrl+Shift+Z)" data-icon="redo-2"></button><button id="export" class="primary" data-icon="arrow-up-right">Export video</button></div></header>
<main><aside class="library panel"><div class="panelhead"><h2>Media library</h2><button id="import" class="subtle" data-icon="plus">Import</button></div><div class="tabs" id="filters"></div><div id="assets"></div><button id="drop" data-icon="upload">Drop files or browse</button></aside>
<section class="monitor panel"><div class="panelhead"><h2><i class="live"></i>Preview</h2><select id="ratio" aria-label="Aspect ratio"><option>16:9</option><option>9:16</option><option>1:1</option></select></div><div id="screen"><canvas id="preview" width="1280" height="720"></canvas></div><div class="transport"><span id="time"></span><div><button id="back" title="Previous clip" data-icon="skip-back"></button><button id="play" title="Play / pause (Space)" data-icon="play"></button><button id="forward" title="Next clip" data-icon="skip-forward"></button></div><button id="fullscreen" title="Full screen" data-icon="maximize"></button></div></section>
<aside class="inspector panel"><div class="panelhead"><h2>Inspector</h2><span class="icon" data-icon="sliders-horizontal"></span></div><div id="inspect"></div></aside>
<section class="timeline panel"><div class="panelhead"><h2><i class="icon" data-icon="list-video"></i> Timeline</h2><div class="edits"><button id="split" title="Split at playhead (S)" data-icon="scissors">Split</button><button id="mark" title="Add timeline marker (M)" aria-label="Add timeline marker" data-icon="bookmark"></button><button id="duplicate" title="Duplicate selected clip" data-icon="copy"></button><button id="delete" title="Delete selection" data-icon="trash-2"></button></div><div class="zoom"><button id="less" title="Zoom out" data-icon="minus"></button><span id="scale"></span><button id="more" title="Zoom in" data-icon="plus"></button></div></div><div class="timelinebody"><div class="lanes"><div class="rulerlabel">TRACKS</div><div data-icon="type">Titles</div><div data-icon="film">Video</div><div data-icon="audio-lines">Audio</div></div><div id="scroll"><div id="sequence"><div id="ruler"></div><div id="titles" class="track"></div><div id="videos" class="track"></div><div id="music" class="track"></div><div id="needle"><i></i></div></div></div></div><footer><span id="status"></span><span>24 fps</span></footer></section></main>
<input type="file" id="files" accept="video/*,image/*,audio/*,.mkv,.mov,.avi" multiple hidden><input type="file" id="openfile" accept=".aethrix,.framecut,.json" hidden>
<dialog id="dialog"><div class="dialoghead"><h2 id="dialogtitle"></h2><button id="close" data-icon="x" title="Close"></button></div><div id="dialogbody"></div></dialog><div id="toast" role="status"></div><script src="/ui/app.js"></script><script src="/ui/agent.js"></script></body></html>
